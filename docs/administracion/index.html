<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Módulo de administración · maqueta — SEDEMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Maqueta del módulo de administración y seguimiento (DEC-242)
   Bosquejo: documentacion/22-bosquejo-modulo-de-administracion.md
   Las variables de :root vienen del formulario: una sola paleta.
   ========================================================= */
/* ==== DESDE EL FORMULARIO: variables de :root (construccion/generar_admin.py; no se edita aquí) ==== */
:root{
  color-scheme: light;

  /* Sombras con color: el foco de los campos y el realce de las filas (DEC-227) */
  --sombra-foco: rgba(26,115,199,.18);
  --sombra-guinda: rgba(157,33,72,.12);

  /* Identidad */
  --guinda:#9D2148; --guinda-osc:#7A1A38; --guinda-cl:#F7F1F3;
  --dorado:#B28E5C;        /* sólo filetes y rellenos, nunca texto */
  --dorado-txt:#8C6C3E;    /* dorado legible, 4.85:1 */

  /* Neutros */
  --texto:#2B2D2E; --gris:#55585A; --gris-cl:#6B6E70;
  --linea:#DCDEE0;         /* separadores */
  --borde:#8E9295;         /* bordes de control, 3.14:1 */
  --fondo:#F4F5F6; --blanco:#FFFFFF;
  --beige:#FFFEF8;         /* encabezado y pie (DEC-132) */

  /* Interacción: lo que se puede tocar y lo que quedó elegido. */
  --azul:#1A56A8; --azul-cl:#EEF3FA;

  /* Función. Un color, un trabajo: si un tono hace dos cosas, deja de
     decir nada. Cinco familias y ninguna suelta fuera de aquí (DEC-95).
       rojo   → error: lo que impide continuar
       ámbar  → pendiente: lo que le falta al proyecto, no a la persona
       verde  → recibida: sólo la pantalla del acuse
       azul   → vive arriba, en Interacción: lo tocable y lo elegido
       neutro → aviso: lo que hay que leer sin alarmarse */
  --error:#B3261E; --error-bg:#FDF3F2; --error-txt:#8C1D18;
  --pend:#8A5200;  --pend-bg:#FFF3CD;  --pend-txt:#6B4A00;
  --ok:#1B6B43;    --ok-bg:#F1F8F4;    --ok-txt:#145032;
  --aviso-bg:#F7F8F9;
  --foco:#1A73C7;

  /* Fondos de superficie, antes sueltos en el código */
  --mapa-bg:#E8EAEC; --carga-bg:#FCFCFD; --redir-bg:#FFFDF9;

  /* Escala tipográfica */
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-base:16px;
  --t-lg:20px; --t-xl:24px; --t-2xl:30px;

  /* Radios */
  --r-ctrl:6px; --r-caja:10px; --r-pill:999px;
}
/* ==== FIN DE LO QUE VIENE DEL FORMULARIO ==== */

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--fondo); color:var(--texto); line-height:1.55; font-size:var(--t-base);
}
h1,h2,h3,h4{font-family:'Cabin','Roboto',Arial,sans-serif;font-weight:600;text-wrap:balance}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:2px}
a{color:var(--azul)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- Estructura ---------- */
.contenedor{max-width:1180px;margin:0 auto;padding:0 20px}
/* La franja dice lo que es la página antes que nada: una maqueta con datos
   ficticios, no el sistema. Gris con rayas, como la de la versión publicada
   del formulario (DEC-137). */
.franja-maqueta{background:repeating-linear-gradient(135deg,var(--gris) 0 14px,var(--gris-cl) 14px 28px);color:var(--blanco);font-size:var(--t-md);padding:10px 20px}
.franja-maqueta p{max-width:1180px;margin:0 auto}
header.titulo{background:var(--beige);border-bottom:3px solid var(--dorado);padding:16px 0}
header.titulo .contenedor{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.logo-inst{display:block;width:auto;height:auto;max-width:100%;max-height:52px}
.titulo-txt h1{font-size:var(--t-xl);color:var(--guinda)}
.titulo-txt p{font-size:var(--t-md);color:var(--gris)}
.barra-perfil{background:var(--blanco);border-bottom:1px solid var(--linea);padding:10px 0}
.barra-perfil .contenedor{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.barra-perfil label{font-weight:600;font-size:var(--t-md)}
.barra-perfil select{font:inherit;font-size:var(--t-md);padding:6px 10px;border:1px solid var(--borde);border-radius:var(--r-ctrl);background:var(--blanco);color:var(--texto);min-height:40px}
.nota-simulada{font-size:var(--t-sm);color:var(--gris)}

/* ---------- Componentes ---------- */
.menu{background:var(--guinda)}
.menu ul{list-style:none;display:flex;flex-wrap:wrap;gap:2px}
.menu a{display:block;color:var(--blanco);text-decoration:none;padding:12px 16px;font-family:'Cabin','Roboto',Arial,sans-serif;font-weight:600;font-size:var(--t-md);min-height:44px}
.menu a:hover{background:var(--guinda-osc)}
.menu a[aria-current="page"]{background:var(--guinda-osc);box-shadow:inset 0 -4px 0 var(--dorado)}
main{padding:24px 0 48px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-caja);padding:24px}
.tarjeta h2{font-size:var(--t-xl);color:var(--guinda);margin-bottom:6px}
.tarjeta h3{font-size:var(--t-base);margin:18px 0 6px}
.resumen{color:var(--gris);font-size:var(--t-md)}
.pendiente{display:inline-block;background:var(--pend-bg);border:1px dashed var(--pend);color:var(--pend-txt);padding:2px 7px;border-radius:4px;font-size:var(--t-xs);font-weight:600}
.boton{font:inherit;font-size:var(--t-md);font-weight:600;min-height:40px;padding:6px 14px;border:1px solid var(--azul);border-radius:var(--r-ctrl);background:var(--blanco);color:var(--azul);cursor:pointer}
.boton:hover{background:var(--azul-cl)}
.boton:disabled{border-color:var(--linea);color:var(--gris-cl);background:var(--blanco);cursor:default}

/* ---------- Bandeja (bloque B) ---------- */
/* Las vistas son enlaces: cambian la dirección y «Atrás» regresa a la anterior.
   Azul, porque es lo que se toca y lo elegido (DEC-95). */
.vistas ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.vistas a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:1px solid var(--borde);border-radius:var(--r-pill);background:var(--blanco);color:var(--azul);text-decoration:none;font-size:var(--t-md);font-weight:500}
.vistas a:hover{background:var(--azul-cl)}
.vistas a[aria-current="page"]{background:var(--azul);border-color:var(--azul);color:var(--blanco)}
.cuenta{font-weight:700}
.plegable{background:var(--aviso-bg);border:1px solid var(--linea);border-radius:var(--r-caja)}
.plegable summary{cursor:pointer;font-weight:600;min-height:44px;padding:10px 16px}
.filtros{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px;padding:0 16px 16px}
.campo label{display:block;font-weight:600;font-size:var(--t-sm);margin-bottom:4px}
.campo select,.campo input{width:100%;font:inherit;font-size:var(--t-md);min-height:40px;padding:6px 10px;border:1px solid var(--borde);border-radius:var(--r-ctrl);background:var(--blanco);color:var(--texto)}
.campo-ancho{grid-column:1/-1}
.tarjeta .titulo-resultados{font-size:var(--t-lg);color:var(--guinda);margin-top:28px}
.origen{color:var(--gris-cl)}
.conteo{font-weight:600;margin:10px 0}
.sin-resultados{padding:16px;background:var(--aviso-bg);border:1px dashed var(--borde);border-radius:var(--r-caja)}
.tabla-marco{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r-caja)}
.tabla-bandeja{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.tabla-bandeja th{text-align:left;vertical-align:bottom;background:var(--guinda-cl);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--dorado)}
.tabla-bandeja td{vertical-align:top;padding:8px 6px;border-top:1px solid var(--linea)}
.tabla-bandeja tbody tr:hover{background:var(--aviso-bg)}
/* El nombre de quien atiende no cabe en el ancho mínimo que le da la tabla. */
.ancha{min-width:9.5em}
.folio{white-space:nowrap;font-weight:600;color:var(--azul)}
.fecha{white-space:nowrap}
.dato-sec{display:block;color:var(--gris);font-size:var(--t-xs)}
.senales{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.senal{background:var(--aviso-bg);border:1px solid var(--borde);border-radius:4px;padding:0 6px;font-size:var(--t-xs)}
.paginacion{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.nota-listado{font-size:var(--t-sm);color:var(--gris);margin-top:12px}

/* ---------- Expediente (bloque C) ---------- */
/* El encabezado se queda arriba al bajar por las seis secciones: folio,
   estado y plazo siempre a la vista (documento 22, §3.3). */
.exp-encabezado{position:sticky;top:0;z-index:1;background:var(--blanco);border-bottom:2px solid var(--dorado);padding:8px 0 12px}
.exp-datos{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:8px;font-size:var(--t-md)}
.exp-datos dt{color:var(--gris);font-size:var(--t-xs);font-weight:600}
.alerta{color:var(--error-txt)}
.seccion-exp{border-top:1px solid var(--linea);margin-top:24px;padding-top:4px}
.tarjeta h4{font-size:var(--t-md);color:var(--gris);margin:16px 0 6px}
.ficha{display:grid;grid-template-columns:minmax(9em,15em) minmax(0,1fr);gap:6px 16px;font-size:var(--t-md)}
/* Cada par va en un div por orden del HTML; para la cuadrícula, la etiqueta y
   el valor son columnas de un mismo renglón. */
.ficha div{display:contents}
.ficha dt{color:var(--gris);font-weight:600}
.ficha dd{white-space:pre-line;overflow-wrap:anywhere}
/* Evidencia (DEC-253): una miniatura por archivo, que se abre en un visor. */
.galeria{list-style:none;padding:0;margin:8px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.archivo-ev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px;border:1px solid var(--borde);border-radius:var(--r-caja);background:var(--blanco);color:var(--texto);font:inherit;font-size:var(--t-md);text-align:left;cursor:pointer}
.archivo-ev:hover{background:var(--azul-cl)}
.archivo-tit{font-weight:600;color:var(--azul)}
.miniatura{display:block;width:100%;height:auto;border-radius:4px;margin-bottom:4px}
.vista-grande{display:block;width:100%;max-width:560px;height:auto;border-radius:4px;margin:8px 0 12px}
.ev-fondo{fill:var(--fondo)}
.ev-icono{fill:none;stroke:var(--gris-cl);stroke-width:3;stroke-linejoin:round}
.ev-texto{fill:var(--gris);font-size:11px;text-anchor:middle}
/* margin:auto lo centra: el reinicio de márgenes le quita el del navegador. */
.visor{margin:auto;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow-y:auto;border:1px solid var(--linea);border-radius:var(--r-caja);padding:20px;background:var(--blanco);color:var(--texto)}
.visor::backdrop{background:var(--texto);opacity:.6}
.visor h4{font-size:var(--t-lg);color:var(--texto);margin:0}
.acciones-visor{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lista-exp{padding-left:20px;font-size:var(--t-md)}
.linea-tiempo{list-style:none;border-left:3px solid var(--linea);margin-left:6px;padding-left:16px;font-size:var(--t-md)}
.linea-tiempo li{position:relative;padding:6px 0}
.linea-tiempo li::before{content:'';position:absolute;left:-23px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--guinda)}
.accion{border-bottom:1px solid var(--linea)}
.accion summary{cursor:pointer;color:var(--azul);font-weight:600;min-height:44px;padding:10px 0}
.accion .ficha{padding-bottom:12px}

/* ---------- Inicio (bloque D) ---------- */
.listas-inicio{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px;margin-top:16px}
.lista-inicio{border:1px solid var(--linea);border-radius:var(--r-caja);padding:14px 16px}
.tarjeta .lista-inicio h3{margin-top:0}

/* ---------- Tablero (bloque D) ---------- */
/* Barras de un solo color con su número al lado (documento 22, §5): un
   indicador se lee sin depender del color. */
.cifras-tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 4px}
.cifras-tablero div{border:1px solid var(--linea);border-radius:var(--r-caja);padding:12px 14px}
.cifras-tablero dt{font-size:var(--t-sm);color:var(--gris);font-weight:600}
.cifras-tablero dd{font-family:'Cabin','Roboto',Arial,sans-serif;font-size:var(--t-2xl);font-weight:600;color:var(--guinda)}
.grupo-tablero{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));align-items:start;gap:16px}
.indicador{border:1px solid var(--linea);border-radius:var(--r-caja);padding:12px 14px}
.tarjeta .indicador h4{margin-top:0;color:var(--texto)}
/* En un indicador la cifra va a la derecha, en una columna a su medida. */
.indicador .ficha{grid-template-columns:minmax(0,1fr) auto;font-size:var(--t-sm)}
.indicador .ficha dd{text-align:right}
.barras,.tabla-chica{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.barras th{width:42%;text-align:left;font-weight:400;padding:3px 8px 3px 0}
.pista{width:100%}
.barras td{padding-top:3px;padding-bottom:3px}
.barra{display:block;height:10px;min-width:2px;background:var(--guinda);border-radius:0 4px 4px 0}
.num{text-align:right;padding-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabla-chica td{padding:4px 6px;border-bottom:1px solid var(--linea)}
.tabla-chica th{padding:4px 6px;border-bottom:1px solid var(--linea);text-align:left}
.tabla-chica .num{text-align:right}

/* ---------- Mapa (bloque D) ---------- */
/* Los colores del mapa vectorial del formulario: contorno guinda sobre
   blanco y alcaldías en gris. El grosor de las líneas no cambia al acercar. */
.mapa-rejilla{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.mapa-lado{display:grid;gap:16px}
.mapa-svg{display:block;width:100%;height:auto;max-height:680px;background:var(--fondo);border:1px solid var(--linea);border-radius:var(--r-caja)}
.mapa-svg path,.mapa-svg circle{vector-effect:non-scaling-stroke}
.mapa-exp{max-width:460px;margin-bottom:12px}
.m-borde{fill:var(--blanco);stroke:var(--guinda);stroke-width:1.5px}
.m-suelo{fill:var(--mapa-bg);stroke:none}
.m-zona{fill:var(--azul-cl);stroke:var(--azul);stroke-width:1px}
.m-zona-sel{fill:var(--azul);fill-opacity:.3}
.m-alcaldia{fill:none;stroke:var(--borde);stroke-width:.75px}
.m-etiqueta{fill:var(--gris-cl);font-family:'Roboto',Arial,sans-serif;text-anchor:middle;pointer-events:none}
.m-punto{fill:var(--guinda);stroke:var(--blanco);stroke-width:1.5px}
.m-cerrada{fill:var(--blanco);stroke:var(--guinda)}
.m-actual{fill:var(--azul)}
.m-liga:focus-visible circle{stroke:var(--foco);stroke-width:4px}
.m-cuenta{fill:var(--texto);font-family:'Roboto',Arial,sans-serif;font-weight:700;pointer-events:none}
.leyenda{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:var(--t-sm);color:var(--gris)}
.muestra{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-radius:50%}
.muestra-abierta{background:var(--guinda)}
.muestra-cerrada{background:var(--blanco);border:2px solid var(--guinda)}
.muestra-zona{background:var(--azul-cl);border:1px solid var(--azul);border-radius:2px}
.muestra-suelo{background:var(--mapa-bg);border:1px solid var(--borde);border-radius:2px}

/* ---------- Captura por personal (bloque E) ---------- */
.acciones-captura{margin:16px 0 8px}
.acciones-captura .boton{display:inline-flex;align-items:center;text-decoration:none}
/* En el teléfono la tabla de lo capturado se desplaza dentro de su marco. */
.desliza{overflow-x:auto}

/* ---------- Búsqueda y administración (bloque F) ---------- */
.campo-folio,.campo-motivo,.campo-alta{max-width:520px;margin:8px 0 10px}
/* La ayuda de un campo va pegada a su etiqueta, no separada como una nota. */
.campo-alta .nota-listado{margin:0 0 6px}
.cuenta-inicio{font-size:var(--t-xl);color:var(--guinda);margin-right:4px}

/* ---------- Pantallas angostas ---------- */
/* En el teléfono cada denuncia es una ficha y cada dato lleva su etiqueta.
   Los títulos de columna quedan para el lector de pantalla, y los «role» de
   la tabla conservan su estructura aunque cambie cómo se dibuja. */
@media (max-width: 860px){
  .tabla-marco{overflow:visible;border:0}
  .tabla-bandeja thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .tabla-bandeja,.tabla-bandeja tbody{display:block}
  .tabla-bandeja tr{display:block;border:1px solid var(--linea);border-radius:var(--r-caja);padding:8px 12px;margin-bottom:12px;background:var(--blanco)}
  .tarjeta{padding:16px}
  .tabla-bandeja td{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:4px 0;border-top:0}
  .tabla-bandeja td::before{content:attr(data-etiqueta);font-weight:600;color:var(--gris)}
  /* El folio no cabe junto a su etiqueta: va debajo, a todo lo ancho. */
  .tabla-bandeja td:first-child{grid-template-columns:minmax(0,1fr);gap:0}
  /* En el teléfono el encabezado fijo taparía media pantalla, y cada dato del
     expediente va debajo de su etiqueta. */
  .exp-encabezado{position:static}
  .exp-encabezado h2{font-size:var(--t-lg)}
  .mapa-rejilla{grid-template-columns:minmax(0,1fr)}
  .ficha{grid-template-columns:minmax(0,1fr);gap:2px}
  .ficha dd{margin-bottom:8px}
}
</style>
</head>
<body>

<div class="franja-maqueta" role="note"><p>Maqueta con datos ficticios. No está conectada a la base ni guarda nada; los perfiles son simulados.</p></div>

<header class="titulo">

var bandeja = {vista:'todas', filtros:{}, texto:'', orden:'recientes', pagina:1};

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function porId(lista, id){ return lista.filter(function(x){ return x.id === id; })[0]; }
function permitida(id){ return perfil.pantallas.indexOf(id) >= 0; }

/* Lo que ve el perfil: su área, o, en capturista, sólo lo que esa persona
   capturó, aunque por el punto haya ido a dar a la otra dirección general
   (DEC-256). Una denuncia sin
   punto todavía no es de ningún área, así que la ven las dos direcciones
   generales hasta que alguien la ubica; quién la ubica está por acordar
   (documento 22, §3.2). En el sistema este filtro lo hace el servidor, no
   la pantalla (SIA-23). */
function visibles(){
  return DENUNCIAS.filter(function(d){
    if(perfil.soloCapturadas) return d.canal !== 'en_linea' && d.captura.capturo === capturistaDe(perfil);
    return !perfil.area || !d.tramite.area_actual || d.tramite.area_actual === perfil.area;
  });
}

/* ---------- Fechas y plazos ---------- */

/* La fecha que cuenta es la de recepción original: en lo capturado por
   personal, la del escrito o la llamada, que el formulario guarda al capturar,
   no la de captura (documento 22, §4, regla 4). */
function recepcion(d){ return d.datos.fecha_recepcion_original || d.datos.fecha_acuse; }
/* Número de día, sin hora: las fechas vienen en hora de la Ciudad (DEC-235)
   y se leen del texto, no con la zona horaria de la computadora. */
function dia(iso){ return Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5; }
function fechaCorta(iso){ return +iso.slice(8, 10)+' '+MESES[+iso.slice(5, 7) - 1]+' '+iso.slice(0, 4); }
function cerrada(d){ return !!porId(ESTADOS, d.tramite.estado).cierra; }
/* Días hábiles entre dos fechas: los que corren después de la primera y
   hasta la segunda. Sin el calendario de días inhábiles (MA-11, bloque F)
   sólo se descuentan sábados y domingos. */
function habilesEntre(desde, hasta){
  var n = 0;
  for(var t = dia(desde) + 1; t <= dia(hasta); t++){
    var s = new Date(t * 864e5).getUTCDay();
    if(s !== 0 && s !== 6) n++;
  }
  return n;
}
/* Desde la recepción hasta hoy o, si ya se cerró, hasta el cierre. */
function diasHabiles(d){
  var h = d.tramite.historial;
  return habilesEntre(recepcion(d), cerrada(d) ? h[h.length - 1].fecha : HOY);
}

/* ---------- Señales de cada denuncia ---------- */

function idDe(d){ return d.datos.folio.replace('SEDEMA/DEN/', '').replace('/', '-'); }
/* Distancia en metros entre dos puntos, por la fórmula del semiverseno. */
function distancia(a, b){
  var r = Math.PI / 180, la1 = +a.lat * r, la2 = +b.lat * r, dla = la2 - la1, dlo = (+b.lon - +a.lon) * r;
  var h = Math.pow(Math.sin(dla / 2), 2) + Math.cos(la1) * Math.cos(la2) * Math.pow(Math.sin(dlo / 2), 2);
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
/* Las abiertas de la misma materia, cerca y en fechas próximas. Se buscan en
   todas, no sólo en las del perfil: el mismo hecho puede haber llegado a la
   otra dirección general. */
function parecidas(d){
  if(cerrada(d) || !d.datos.lat) return [];
  return DENUNCIAS.filter(function(o){
    return o !== d && !cerrada(o) && o.datos.lat && o.datos.materia === d.datos.materia &&
      distancia(d.datos, o.datos) <= UMBRAL_DUPLICADO.metros &&
      Math.abs(dia(recepcion(d)) - dia(recepcion(o))) <= UMBRAL_DUPLICADO.dias;
  });
}
/* Lo que conviene ver de un vistazo en el listado; cada señal es también una
   vista. */
function senales(d){
  var s = [];
  if(d.datos.identificacion === 'anonima') s.push('Anónima');
  if(d.datos.tipo_denunciado === 'gobierno') s.push('Autoridad señalada');
  if(d.datos.alcaldia_discrepa === 'si') s.push('Alcaldía no coincide');
  parecidas(d).forEach(function(o){ s.push('Posible duplicado: '+o.datos.folio.slice(-8)); });
  d.tramite.marcas.forEach(function(m){ s.push(porId(MARCAS, m).nom); });
  return s;
}

/* ---------- Bandeja (bloque B) ---------- */

function normaliza(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
/* La vista, los filtros y la búsqueda se suman. La búsqueda va por folio,
   establecimiento, calle y hechos (documento 22, §3.2); cada palabra debe
   aparecer, con o sin acentos. */
function filtrada(){
  var v = porId(VISTAS, bandeja.vista), palabras = normaliza(bandeja.texto).split(/\s+/).filter(Boolean);
  return visibles().filter(function(d){
    if(!v.cumple(d)) return false;
    if(Object.keys(bandeja.filtros).some(function(k){ return porId(FILTROS, k).valor(d) !== bandeja.filtros[k]; })) return false;
    var t = normaliza([d.datos.folio, d.datos.nombre_estab, d.datos.calle, d.datos.hechos].join(' '));
    return palabras.every(function(p){ return t.indexOf(p) >= 0; });
  }).sort(function(a, b){
    var x = recepcion(a), y = recepcion(b);
    return (x < y ? -1 : x > y ? 1 : 0) * (bandeja.orden === 'antiguas' ? 1 : -1);
  });
}

/* Una lista de filtro, de la bandeja o del tablero: «elegidos» es donde esa
   pantalla guarda lo elegido y «alCambiar», la función que la repinta. Sin
   catálogo, las opciones van por «orden» o, si no lo hay, por su nombre. */
function campoFiltro(f, todas, elegidos, alCambiar){
  var vals = [], clave = f.orden || f.texto;
  todas.forEach(function(d){ var x = f.valor(d); if(vals.indexOf(x) < 0) vals.push(x); });
  if(vals.length < 2) return '';
  vals.sort(f.catalogo
    ? function(a, b){ return f.catalogo.indexOf(porId(f.catalogo, a)) - f.catalogo.indexOf(porId(f.catalogo, b)); }
    : function(a, b){ return String(clave(a)).localeCompare(String(clave(b)), 'es'); });
  return '<div class="campo"><label for="f-'+f.id+'">'+esc(f.nom)+'</label>'+
    '<select id="f-'+f.id+'" data-filtro="'+f.id+'" onchange="'+alCambiar+'(this)"><option value="*">'+esc(f.todos)+'</option>'+
    vals.map(function(x){ return '<option value="'+esc(x)+'"'+(elegidos[f.id] === x ? ' selected' : '')+'>'+esc(f.texto(x))+'</option>'; }).join('')+
    '</select></div>';
}

function pintaBandeja(param){
  var p = porId(PANTALLAS, 'bandeja'), v = porId(VISTAS, param) || VISTAS[0], todas = visibles();
  if(bandeja.vista !== v.id) bandeja.pagina = 1;
  bandeja.vista = v.id;
  var alcance = perfil.soloCapturadas ? 'Ve sólo lo que capturó '+capturistaDe(perfil)
              : perfil.area ? 'Ve las denuncias de la '+perfil.area+' y las que aún no tienen punto' : 'Ve todas las denuncias de la Secretaría';
  /* En el teléfono los filtros empiezan plegados para que el listado quede a
     la vista; abiertos, si hay alguno puesto, para que se vea por qué faltan
     denuncias. */
  var abiertos = window.matchMedia('(min-width: 861px)').matches || Object.keys(bandeja.filtros).length || bandeja.texto;
  document.getElementById('pantalla').innerHTML =
    '<div class="tarjeta">'+
      '<h2 tabindex="-1">'+esc(p.nom)+'</h2>'+
      '<p class="resumen">'+esc(p.resumen)+' '+alcance+'.</p>'+
      '<nav class="vistas" aria-label="Vistas de la bandeja"><ul>'+VISTAS.map(function(x){
        return '<li><a href="#/bandeja/'+x.id+'"'+(x === v ? ' aria-current="page"' : '')+'>'+esc(x.nom)+
          ' <span class="cuenta">'+todas.filter(x.cumple).length+'</span></a></li>';
      }).join('')+'</ul></nav>'+
      '<details class="plegable"'+(abiertos ? ' open' : '')+'><summary>Filtros y búsqueda</summary>'+
      '<div class="filtros" role="search" aria-label="Filtros de la bandeja">'+
        '<div class="campo campo-ancho"><label for="f-texto">Buscar por folio, establecimiento, calle o texto de los hechos</label>'+
          '<input id="f-texto" type="search" autocomplete="off" value="'+esc(bandeja.texto)+'" oninput="busca(this)"></div>'+
        FILTROS.map(function(f){ return campoFiltro(f, todas, bandeja.filtros, 'filtra'); }).join('')+
        '<div class="campo"><label for="f-orden">Orden</label><select id="f-orden" onchange="ordena(this)">'+
          '<option value="recientes"'+(bandeja.orden === 'recientes' ? ' selected' : '')+'>Más recientes primero</option>'+
          '<option value="antiguas"'+(bandeja.orden === 'antiguas' ? ' selected' : '')+'>Más antiguas primero</option></select></div>'+
        '<div class="campo-ancho"><button type="button" class="boton" id="quitar-filtros" onclick="quitaFiltros()">Quitar filtros y búsqueda</button></div>'+
      '</div></details>'+
      '<h3 class="titulo-resultados" tabindex="-1"'+(param ? ' data-foco' : '')+'>'+esc(v.nom)+'</h3>'+
      '<p class="resumen">'+esc(v.que)+(v.origen ? ' <span class="origen">('+esc(v.origen)+')</span>' : '')+'</p>'+
      '<p class="conteo" id="conteo" role="status"></p>'+
      '<div id="resultados"></div>'+
      '<p class="nota-listado">Los estados son una propuesta por acordar con la DGIVA y la DGCORENADR (documento 22, §4; MA-07 y P-14); también lo son las marcas de revisión y el umbral de posible duplicado.</p>'+
      '<p class="nota-listado">Los plazos son internos: el formulario no los menciona a quien denuncia (DEC-138). Los días hábiles descuentan sábados y domingos; falta el calendario de días inhábiles (MA-11).</p>'+
    '</div>';
  pintaResultados();
}

function tablaBandeja(lista){
  /* Once columnas caben a partir de unos 1 180 píxeles; en una pantalla más
     angosta la tabla se desplaza dentro de su marco, y el marco recibe el
     foco para que también se recorra con el teclado. */
  return '<div class="tabla-marco" role="region" aria-label="Listado de denuncias" tabindex="0"><table class="tabla-bandeja" role="table" aria-label="Denuncias de la vista">'+
    '<thead role="rowgroup"><tr role="row">'+COLUMNAS.map(function(c){ return '<th scope="col" role="columnheader">'+esc(c.nom)+'</th>'; }).join('')+'</tr></thead>'+
    '<tbody role="rowgroup">'+lista.map(function(d){
      return '<tr role="row">'+COLUMNAS.map(function(c){
        return '<td role="cell"'+(c.clase ? ' class="'+c.clase+'"' : '')+' data-etiqueta="'+esc(c.nom)+'"><div>'+c.html(d)+'</div></td>';
      }).join('')+'</tr>';
    }).join('')+'</tbody></table></div>';
}

function pintaResultados(){
  var lista = filtrada(), paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  var activos = Object.keys(bandeja.filtros).length + (bandeja.texto.trim() ? 1 : 0);
  bandeja.pagina = Math.min(bandeja.pagina, paginas);
  document.getElementById('conteo').textContent = lista.length+(lista.length === 1 ? ' denuncia' : ' denuncias')+
    (activos ? ' con '+activos+(activos === 1 ? ' filtro' : ' filtros') : '')+(paginas > 1 ? '. Página '+bandeja.pagina+' de '+paginas : '')+'.';
  document.getElementById('quitar-filtros').hidden = !activos;
  document.getElementById('resultados').innerHTML = !lista.length
    ? '<p class="sin-resultados">Ninguna denuncia cumple con esta vista'+(activos ? ' y estos filtros' : '')+'.</p>'
    : tablaBandeja(lista.slice((bandeja.pagina - 1) * POR_PAGINA, bandeja.pagina * POR_PAGINA))+
      (paginas > 1 ? '<nav class="paginacion" aria-label="Páginas de la bandeja">'+
        '<button type="button" class="boton" onclick="paginaA('+(bandeja.pagina - 1)+')"'+(bandeja.pagina === 1 ? ' disabled' : '')+'>Anterior</button>'+
        '<span>Página '+bandeja.pagina+' de '+paginas+'</span>'+
        '<button type="button" class="boton" onclick="paginaA('+(bandeja.pagina + 1)+')"'+(bandeja.pagina === paginas ? ' disabled' : '')+'>Siguiente</button></nav>' : '');
}

/* Filtros, búsqueda y orden repintan sólo el listado: el foco se queda en el
   control que la persona está usando. */
function filtra(sel){
  if(sel.value === '*') delete bandeja.filtros[sel.getAttribute('data-filtro')];
  else bandeja.filtros[sel.getAttribute('data-filtro')] = sel.value;
  bandeja.pagina = 1; pintaResultados();
}
function busca(campo){ bandeja.texto = campo.value; bandeja.pagina = 1; pintaResultados(); }
function ordena(sel){ bandeja.orden = sel.value; bandeja.pagina = 1; pintaResultados(); }
/* Al cambiar de página el botón pulsado desaparece; el foco va al título del
   listado para que el teclado empiece arriba. */
function paginaA(n){ bandeja.pagina = n; pintaResultados(); document.querySelector('#pantalla .titulo-resultados').focus(); }
function quitaFiltros(){
  bandeja.filtros = {}; bandeja.texto = ''; bandeja.pagina = 1;
  pintaBandeja(bandeja.vista);
  document.getElementById('f-texto').focus();
}

/* ---------- Inicio (bloque D) ---------- */

/* El perfil de atención simula a la primera persona activa de su área. */
function personaDe(p){ return p.rol === 'atencion' ? (activas(p.area, 'atencion')[0] || {nombre:''}).nombre : ''; }

function pintaInicio(){
  var p = porId(PANTALLAS, 'inicio'), persona = personaDe(perfil);
  var listas = LISTAS_INICIO.filter(function(l){ return l.roles.indexOf(perfil.rol) >= 0; });
  var html = '<div class="tarjeta"><h2 tabindex="-1">'+esc(p.nom)+'</h2><p class="resumen">'+esc(p.resumen)+'</p>';
  if(!listas.length){
    document.getElementById('pantalla').innerHTML = html+inicioAdministracion()+'</div>';
    return;
  }
  html += '<p class="resumen">Hoy es '+esc(fechaCorta(HOY))+' (fecha fija de la maqueta). '+
    (persona ? 'Este perfil simula a '+esc(persona)+'.' : perfil.soloCapturadas ? 'Este perfil simula a '+esc(capturistaDe(perfil))+' y ve sólo lo que capturó.'
      : perfil.area ? 'Este perfil ve toda la '+esc(perfil.area)+'.' : '')+'</p>'+
    '<div class="listas-inicio">'+listas.map(function(l){
      var lista = visibles().filter(function(d){
        return l.cumple(d) && (l.deArea || !persona || d.tramite.asignado === persona);
      }).sort(function(a, b){ return recepcion(a) < recepcion(b) ? 1 : -1; });
      return '<section class="lista-inicio"><h3><span class="cuenta-inicio">'+lista.length+'</span> '+esc(l.nom)+'</h3>'+
        '<p class="nota-listado">'+esc(l.que)+'</p>'+
        (lista.length ? '<ul class="lista-exp">'+lista.map(function(d){
          return '<li><a href="#/expediente/'+idDe(d)+'">'+esc(d.datos.folio)+'</a> · '+esc(porId(MATERIAS, d.datos.materia).nom)+
            ' · '+esc(porId(ESTADOS, d.tramite.estado).nom)+'<span class="dato-sec">'+plazoTexto(d)+'</span></li>';
        }).join('')+'</ul>' : '<p>Nada en esta lista.</p>')+
      '</section>';
    }).join('')+'</div></div>';
  document.getElementById('pantalla').innerHTML = html;
}

/* ---------- Tablero (bloque D) ---------- */

/* Lo filtrado en el tablero; vive mientras la página está abierta. */
var tablero = {filtros:{}};

function pct(k, n){ return n ? (100 * k / n).toFixed(1)+' %' : '—'; }
function fechaDe(d, estado){ var h = d.tramite.historial.filter(function(x){ return x.estado === estado; })[0]; return h ? h.fecha : ''; }
/* Cuántas hay de cada valor, de mayor a menor. */
function cuenta(lista, valor){
  var c = {};
  lista.forEach(function(d){ var v = valor(d); c[v] = (c[v] || 0) + 1; });
  return Object.keys(c).map(function(k){ return {etq:k, n:c[k]}; })
    .sort(function(a, b){ return b.n - a.n || a.etq.localeCompare(b.etq, 'es'); });
}
/* Barras de un solo color, cada una con su número escrito: se leen como una
   tabla. Con «minimo», una cifra menor no se muestra. */
function barras(titulo, filas, nota, minimo){
  var max = Math.max.apply(null, filas.map(function(f){ return f.n; }).concat([1]));
  return '<section class="indicador"><h4>'+esc(titulo)+'</h4>'+
    (!filas.length ? '<p>Ninguna con estos filtros.</p>' : '<table class="barras"><tbody>'+filas.map(function(f){
      var oculta = minimo && f.n > 0 && f.n < minimo;
      return '<tr><th scope="row">'+esc(f.etq)+'</th><td class="pista">'+(oculta || !f.n ? '' : '<span class="barra" style="width:'+Math.round(100 * f.n / max)+'%"></span>')+'</td>'+
        '<td class="num">'+(oculta ? 'menos de '+minimo : f.n)+'</td></tr>';
    }).join('')+'</tbody></table>')+
    (nota ? '<p class="nota-listado">'+nota+'</p>' : '')+'</section>';
}
/* Un indicador que es un texto, no una cifra. */
function aviso(titulo, texto){ return '<section class="indicador"><h4>'+esc(titulo)+'</h4><p class="nota-listado">'+texto+'</p></section>'; }
/* Un indicador de pocas cifras, cada una con su etiqueta. */
function cifras(titulo, pares, nota){
  return '<section class="indicador"><h4>'+esc(titulo)+'</h4><dl class="ficha">'+
    pares.map(function(p){ return par(p[0], p[1]); }).join('')+'</dl>'+(nota ? '<p class="nota-listado">'+nota+'</p>' : '')+'</section>';
}
function enPlazo(titulo, lista, hasta, limite, nota){
  var k = lista.filter(function(d){ return habilesEntre(recepcion(d), hasta(d)) <= limite; }).length;
  return cifras(titulo, [['Dentro del plazo', k+' de '+lista.length+' ('+pct(k, lista.length)+')'], ['Fuera del plazo', String(lista.length - k)]], nota);
}

/* Recibidas, en trámite y cerradas por año o por mes: cada periodo es el
   filtro del tablero con ese id, con su valor y su texto. */
function porPeriodo(c, id, titulo, columna){
  var f = porId(FILTROS_TABLERO, id);
  return '<section class="indicador"><h4>'+esc(titulo)+'</h4>'+
    '<table class="tabla-chica"><thead><tr><th scope="col">'+esc(columna)+'</th><th scope="col" class="num">Recibidas</th><th scope="col" class="num">En trámite</th><th scope="col" class="num">Cerradas</th></tr></thead><tbody>'+
    cuenta(c, f.valor).sort(function(a, b){ return a.etq < b.etq ? -1 : 1; }).map(function(m){
      var cer = c.filter(function(d){ return f.valor(d) === m.etq && cerrada(d); }).length;
      return '<tr><th scope="row">'+esc(f.texto(m.etq))+'</th><td class="num">'+m.n+'</td><td class="num">'+(m.n - cer)+'</td><td class="num">'+cer+'</td></tr>';
    }).join('')+'</tbody></table></section>';
}

function grupoOperacion(c){
  var carga = perfil.rol === 'coordinacion'
    ? barras('Carga por persona asignada', cuenta(c.filter(function(d){ return !cerrada(d) && d.tramite.asignado; }), function(d){ return d.tramite.asignado; }), 'Denuncias abiertas a cargo de cada persona.')
    : aviso('Carga por persona asignada', 'Sólo la ve coordinación (documento 22, §5).');
  return porPeriodo(c, 'anio', 'Recibidas, en trámite y cerradas, por año', 'Año')+
    porPeriodo(c, 'periodo', 'Recibidas, en trámite y cerradas, por mes', 'Mes')+
    barras('Recibidas por canal', cuenta(c, function(d){ return porId(CANALES, d.canal).nom; })) + carga;
}

function grupoPlazos(c){
  var turnadas = c.filter(function(d){ return fechaDe(d, 'turnada'); });
  var valoradas = c.filter(function(d){ return d.tramite.historial.some(function(h){ return VALORACION.indexOf(h.estado) >= 0; }); });
  var primera = function(d){ return d.tramite.historial.filter(function(h){ return VALORACION.indexOf(h.estado) >= 0; })[0].fecha; };
  var enProc = c.filter(function(d){ var p = porId(ESTADOS, d.tramite.estado).plazo; return p && p.dias === 'suelo'; });
  var vencidos = enProc.filter(function(d){ return plazoDe(d).vencido; }).length;
  var porUbicar = c.filter(function(d){ return d.tramite.estado === 'por_ubicar'; });
  var notificadas = c.filter(function(d){ return fechaDe(d, 'resuelta') && fechaDe(d, 'notificada'); });
  var dias = notificadas.map(function(d){ return habilesEntre(fechaDe(d, 'resuelta'), fechaDe(d, 'notificada')); });
  return enPlazo('Turnado en 3 días hábiles', turnadas, function(d){ return fechaDe(d, 'turnada'); }, 3, 'Desde la recepción original hasta el turnado (Manual Administrativo).')+
    enPlazo('Primera valoración en 10 días hábiles', valoradas, primera, 10, 'Hasta que se admite, se returna, se remite o se concluye.')+
    cifras('Procedimiento en 93 o 90 días hábiles', [['Dentro del plazo', String(enProc.length - vencidos)], ['Fuera del plazo', String(vencidos)]],
      'Las que están en procedimiento: 93 días en la DGIVA y 90 en la DGCORENADR.')+
    cifras('Tiempo «por ubicar»', porUbicar.length ? porUbicar.map(function(d){ return [d.datos.folio, diasHabiles(d)+' días hábiles']; }) : [['Por ubicar', 'Ninguna']],
      'Mide lo que cuesta recibir sin punto (DEC-123).')+
    cifras('De la resolución a la notificación', [['Notificadas', String(notificadas.length)],
      ['Promedio', dias.length ? (dias.reduce(function(a, b){ return a + b; }, 0) / dias.length).toFixed(1)+' días hábiles' : '—']],
      'Sin plazo fijado todavía (P-07).');
}

function grupoResultado(c){
  var visitadas = cuenta(c, function(d){ return d.datos.materia; }).map(function(m){
    var de = c.filter(function(d){ return d.datos.materia === m.etq; });
    return [porId(MATERIAS, m.etq).nom, de.filter(function(d){ return fechaDe(d, 'visita_practicada'); }).length+' de '+de.length];
  });
  var distintas = c.filter(function(d){ return d.tramite.materia_confirmada !== d.datos.materia; });
  return cifras('Con visita practicada, por materia', visitadas, 'Línea base histórica: 76.7 % en plásticos de un solo uso (documento 22, §5).')+
    cifras('Remitidas a otra autoridad y returnadas, por separado', [['Remitidas', String(c.filter(function(d){ return fechaDe(d, 'remitida'); }).length)],
      ['Returnadas', String(c.filter(function(d){ return fechaDe(d, 'returnada'); }).length)]], 'Lo que la base histórica no distingue (PB-01).')+
    cifras('Concluidas sin materia y acumuladas', [['Sin materia', String(c.filter(function(d){ return d.tramite.estado === 'sin_materia'; }).length)],
      ['Acumuladas', String(c.filter(function(d){ return d.tramite.estado === 'acumulada'; }).length)]])+
    '<section class="indicador"><h4>Materia declarada frente a la confirmada</h4><p>'+distintas.length+' de '+c.length+' distintas.</p>'+
      (distintas.length ? '<ul class="lista-exp">'+distintas.map(function(d){
        return '<li>'+esc(d.datos.folio)+': '+esc(porId(MATERIAS, d.datos.materia).nom)+' → '+esc(porId(MATERIAS, d.tramite.materia_confirmada).nom)+'</li>';
      }).join('')+'</ul>' : '')+
      '<p class="nota-listado">Mide si el paso 1 del formulario se entiende (D-2).</p></section>';
}

function grupoTerritorio(c){
  var conPunto = c.filter(function(d){ return d.datos.lat; });
  return barras('Por alcaldía', cuenta(c, function(d){ return d.datos.alcaldia || d.datos.alcaldia_dir || 'Sin alcaldía'; }))+
    barras('Por tipo de zona', cuenta(c, function(d){ return d.datos.capa_clase || 'Sin ubicar'; }))+
    barras('Por colonia, las cinco con más', cuenta(conPunto, function(d){ return d.datos.colonia || 'Sin colonia'; }).slice(0, 5))+
    cifras('En suelo de conservación, Área Natural Protegida y Área de Valor Ambiental',
      ['Suelo de conservación', 'Área Natural Protegida', 'Área de Valor Ambiental'].map(function(z){
        var n = c.filter(function(d){ return d.datos.capa_clase === z; }).length;
        return [z, n+' de '+c.length+' ('+pct(n, c.length)+')'];
      }),
      'Cada denuncia cuenta en una sola, la que dio el cruce del formulario (DEC-251). Línea base histórica, suelo de conservación y Áreas Naturales Protegidas juntos: 4.3 %; 0.2 % en Milpa Alta (D-18).');
}

function grupoCanal(c){
  var anon = c.filter(function(d){ return d.datos.identificacion === 'anonima'; });
  var correos = anon.filter(function(d){ return d.tramite.notificacion && d.tramite.notificacion.medio === 'correo'; });
  var rebotes = correos.filter(function(d){ return d.tramite.notificacion.resultado === 'rebotado'; }).length;
  function estadistica(k, titulo){
    return barras(titulo, OPCIONES_ESTADISTICA[k].map(function(o){ return {etq:o.t, n:c.filter(function(d){ return d.datos[k] === o.v; }).length}; })
      .concat([{etq:'Sin respuesta', n:c.filter(function(d){ return !d.datos[k]; }).length}]),
      'Sólo en agregado; una cifra menor que '+MINIMO_AGREGADO+' no se muestra (documento 22, §7).', MINIMO_AGREGADO);
  }
  return cifras('Anónimas y con datos', [['Anónimas', String(anon.length)], ['Con datos', String(c.length - anon.length)]], 'Seguimiento de DEC-03.')+
    cifras('Notificación por correo, en anónimas', [['Enviadas', String(correos.length)], ['Entregadas', String(correos.length - rebotes)], ['Rebotadas', String(rebotes)]],
      'Seguimiento de DEC-233 y SIA-29.')+
    cifras('Con punto y con evidencia', [['Con punto', String(c.filter(function(d){ return d.datos.lat; }).length)],
      ['Sin punto', String(c.filter(function(d){ return !d.datos.lat; }).length)],
      ['Con evidencia', String(c.filter(function(d){ return d.archivos.length; }).length)],
      ['Sin evidencia', String(c.filter(function(d){ return !d.archivos.length; }).length)]], 'Calidad de la captura.')+
    estadistica('sexo_genero', 'Género')+estadistica('edad_rango', 'Rango de edad');
}

/* Los cinco grupos del documento 22, §5, con sus nombres. */
var GRUPOS_TABLERO = [['Operación', grupoOperacion], ['Plazos', grupoPlazos], ['Resultado', grupoResultado], ['Territorio', grupoTerritorio], ['Canal', grupoCanal]];

function conjuntoTablero(){
  return visibles().filter(function(d){
    return FILTROS_TABLERO.every(function(f){ return tablero.filtros[f.id] === undefined || f.valor(d) === tablero.filtros[f.id]; });
  });
}
function cifrasTablero(c){
  var abiertas = c.filter(function(d){ return !cerrada(d); });
  return [['Recibidas', c.length], ['En trámite', abiertas.length], ['Cerradas', c.length - abiertas.length],
    ['Con el plazo vencido', abiertas.filter(function(d){ var p = plazoDe(d); return p && p.vencido; }).length]];
}
function pintaIndicadores(){
  var c = conjuntoTablero();
  document.getElementById('conteo-tablero').textContent = c.length+(c.length === 1 ? ' denuncia' : ' denuncias')+' con estos filtros.';
  document.getElementById('indicadores').innerHTML =
    '<dl class="cifras-tablero">'+cifrasTablero(c).map(function(x){ return par(x[0], String(x[1])); }).join('')+'</dl>'+
    GRUPOS_TABLERO.map(function(g){ return '<h3>'+esc(g[0])+'</h3><div class="grupo-tablero">'+g[1](c)+'</div>'; }).join('');
}

function pintaTablero(){
  var p = porId(PANTALLAS, 'tablero'), base = visibles();
  document.getElementById('pantalla').innerHTML =
    '<div class="tarjeta"><h2 tabindex="-1">'+esc(p.nom)+'</h2><p class="resumen">'+esc(p.resumen)+'</p>'+
    '<p><span class="pendiente">Cifras de las 40 denuncias de prueba: muestran cómo se leería el tablero, no son estadística</span></p>'+
    '<details class="plegable"'+(window.matchMedia('(min-width: 861px)').matches || Object.keys(tablero.filtros).length ? ' open' : '')+'><summary>Filtros</summary>'+
      '<div class="filtros" role="search" aria-label="Filtros del tablero">'+
        FILTROS_TABLERO.map(function(f){ return campoFiltro(f, base, tablero.filtros, 'filtraTablero'); }).join('')+
      '</div></details>'+
    '<p class="conteo" id="conteo-tablero" role="status"></p><div id="indicadores"></div></div>';
  pintaIndicadores();
}
function filtraTablero(sel){
  if(sel.value === '*') delete tablero.filtros[sel.getAttribute('data-filtro')];
  else tablero.filtros[sel.getAttribute('data-filtro')] = sel.value;

/* ---------- Mapa (bloque D) ---------- */

/* La proyección del mapa vectorial del formulario: la longitud se escala por
   el coseno de la latitud media, para que la Ciudad no se vea ancha. Sin
   mosaicos ni calles: sólo capas del SIA, y nada sale a internet. */
var K_MAPA = Math.cos((CAPAS.bbox[1] + CAPAS.bbox[3]) / 2 * Math.PI / 180);
/* Lo filtrado y acercado en el mapa operativo; vive mientras la página está
   abierta. */
var mapa = {filtros:{}, zona:''};

function poligonos(g){ return g.type === 'Polygon' ? [g.coordinates] : g.coordinates; }
function trazo(g){
  return poligonos(g).map(function(p){
    return p.map(function(anillo){
      return anillo.map(function(pt, i){ return (i ? 'L' : 'M')+(pt[0] * K_MAPA).toFixed(5)+' '+(-pt[1]).toFixed(5); }).join('')+'Z';
    }).join('');
  }).join('');
}
/* La caja [lon0, lat0, lon1, lat1] que contiene una geometría. */
function cajaDe(g){
  var c = [180, 90, -180, -90];
  poligonos(g).forEach(function(p){ p[0].forEach(function(pt){
    c = [Math.min(c[0], pt[0]), Math.min(c[1], pt[1]), Math.max(c[2], pt[0]), Math.max(c[3], pt[1])];
  }); });
  return c;
}
/* Dónde va el nombre de una alcaldía: el promedio de los vértices de su
   contorno, como en el mapa del formulario; cae más adentro que el centro de
   su caja. */
function centroDe(g){
  var s = [0, 0], n = 0;
  poligonos(g).forEach(function(p){ p[0].forEach(function(pt){ s[0] += pt[0]; s[1] += pt[1]; n++; }); });
  return [s[0] / n, s[1] / n];
}
/* Las capas del SIA y las denuncias de «lista», encuadradas en «caja». Cada
   punto es una liga a su expediente; «actual» se resalta y «zona» es el
   polígono del cruce que se pinta más fuerte. Varias denuncias en el mismo
   punto llevan al lado cuántas son. */
function mapaSvg(lista, caja, etiqueta, actual, zona){
  var x0 = caja[0] * K_MAPA, x1 = caja[2] * K_MAPA, y0 = -caja[3], y1 = -caja[1], m = Math.max(x1 - x0, y1 - y0) * 0.05;
  var vb = [x0 - m, y0 - m, x1 - x0 + 2 * m, y1 - y0 + 2 * m], r = Math.max(vb[2], vb[3]) * 0.008, grupos = {};
  lista.forEach(function(d){ var k = d.datos.lat+','+d.datos.lon; (grupos[k] = grupos[k] || []).push(d); });
  return '<svg class="mapa-svg" viewBox="'+vb.map(function(n){ return n.toFixed(5); }).join(' ')+'" role="group" aria-label="'+esc(etiqueta)+'">'+
    '<path class="m-borde" d="'+trazo(CAPAS.borde)+'"/>'+
    CAPAS.suelo.map(function(g){ return '<path class="m-suelo" d="'+trazo(g)+'"/>'; }).join('')+
    CAPAS.zonas.map(function(z){ return '<path class="m-zona'+(z.nombre === zona ? ' m-zona-sel' : '')+'" d="'+trazo(z.g)+'"><title>'+esc(z.nombre)+'</title></path>'; }).join('')+
    CAPAS.alcaldias.map(function(a){ return '<path class="m-alcaldia" d="'+trazo(a.g)+'"><title>'+esc(a.nombre)+'</title></path>'; }).join('')+
    CAPAS.alcaldias.map(function(a){
      var c = centroDe(a.g);
      return '<text class="m-etiqueta" x="'+(c[0] * K_MAPA).toFixed(5)+'" y="'+(-c[1]).toFixed(5)+'" font-size="'+(vb[3] * 0.016).toFixed(5)+'">'+esc(a.nombre)+'</text>';
    }).join('')+
    Object.keys(grupos).map(function(k){
      /* La denuncia actual se dibuja al final, para que otra en el mismo
         punto no la tape. */
      var g = grupos[k].sort(function(a, b){ return (a === actual) - (b === actual); }), x = +g[0].datos.lon * K_MAPA, y = -g[0].datos.lat;
      return g.map(function(d){
        return '<a class="m-liga" href="#/expediente/'+idDe(d)+'"><circle class="m-punto'+(cerrada(d) ? ' m-cerrada' : '')+(d === actual ? ' m-actual' : '')+
          '" cx="'+x.toFixed(6)+'" cy="'+y.toFixed(6)+'" r="'+(d === actual ? 1.6 * r : r).toFixed(6)+'"><title>'+
          esc(d.datos.folio+' · '+porId(MATERIAS, d.datos.materia).nom+' · '+porId(ESTADOS, d.tramite.estado).nom)+'</title></circle></a>';
      }).join('')+(g.length > 1 ? '<text class="m-cuenta" x="'+(x + 1.4 * r).toFixed(6)+'" y="'+(y - r).toFixed(6)+'" font-size="'+(2.6 * r).toFixed(6)+'">'+g.length+'</text>' : '');
    }).join('')+
  '</svg>';
}
function leyendaMapa(){
  return '<ul class="leyenda">'+[['muestra-abierta', 'Denuncia abierta'], ['muestra-cerrada', 'Denuncia cerrada'],
    ['muestra-zona', 'Área protegida con denuncias'], ['muestra-suelo', 'Suelo de conservación']].map(function(x){
      return '<li><span class="muestra '+x[0]+'" aria-hidden="true"></span>'+x[1]+'</li>';
    }).join('')+'</ul>';
}

function pintaMapaCuerpo(){
  var c = visibles().filter(function(d){
    return FILTROS_MAPA.every(function(f){ return mapa.filtros[f.id] === undefined || f.valor(d) === mapa.filtros[f.id]; });
  });
  var conPunto = c.filter(function(d){ return d.datos.lat; }), sinPunto = c.filter(function(d){ return !d.datos.lat; });
  var alc = CAPAS.alcaldias.filter(function(a){ return a.nombre === mapa.zona; })[0];

  document.getElementById('mapa-cuerpo').innerHTML = '<div class="mapa-rejilla"><div>'+
      mapaSvg(conPunto, alc ? cajaDe(alc.g) : CAPAS.bbox, 'Mapa de '+(alc ? alc.nombre : 'la Ciudad de México')+' con '+conPunto.length+' denuncias')+

      barras('Por colonia, las ocho con más', cuenta(conPunto, function(d){ return d.datos.colonia || 'Sin colonia'; }).slice(0, 8))+
      barras('Por celda UGA, las ocho con más', cuenta(conPunto, function(d){ return d.datos.uga; }).slice(0, 8))+
      (sinPunto.length ? aviso('Sin punto', 'No aparecen en el mapa hasta que se ubiquen (SIA-09): '+sinPunto.map(function(d){
        return '<a href="#/expediente/'+idDe(d)+'">'+esc(d.datos.folio)+'</a>'; }).join(', ')+'.') : '')+
    '</div></div>';
}

/* ---------- Búsqueda y exportación (bloque F) ---------- */

/* Lo que sale en la descarga de la bandeja: sus columnas, como datos. Los de
   quien denuncia, sólo en la de coordinación, con motivo y registro
   (documento 22, §3.7), y tomados de los bloques del acuse para no armarlos
   dos veces. Género y edad nunca: sólo van en agregado (§7). */
var EXPORTA = [
  ['Folio',            function(d){ return d.datos.folio; }],
  ['Recepción',        function(d){ return recepcion(d); }],
  ['Canal',            function(d){ return porId(CANALES, d.canal).nom; }],
  ['Materia',          function(d){ return porId(MATERIAS, d.datos.materia).nom; }],
  ['Alcaldía',         function(d){ return d.datos.alcaldia || d.datos.alcaldia_dir || ''; }],
  ['Colonia',          function(d){ return d.datos.colonia || ''; }],
  ['Tipo de zona',     function(d){ return d.datos.capa_clase || ''; }],
  ['Área que recibe',  function(d){ return d.tramite.area_actual; }],
  ['Remisión',         function(d){ return d.datos.remite_a || ''; }],
  ['Estado',           function(d){ return porId(ESTADOS, d.tramite.estado).nom; }],
  ['Persona asignada', function(d){ return d.tramite.asignado; }],
  ['Días hábiles',     function(d){ return diasHabiles(d); }]
];
var EXPORTA_PERSONALES = ['Denunciante', 'Contacto', 'Domicilio para notificaciones'];

/* Un CSV que se descarga: con la marca BOM para que la hoja de cálculo lea los
   acentos, y sin dejar que un valor empiece por = + - @, que la hoja tomaría
   por fórmula. */
function valorCsv(v){ v = String(v == null ? '' : v); if(/^[=+\-@]/.test(v)) v = "'"+v; return '"'+v.replace(/"/g, '""')+'"'; }
function descargaCsv(nombre, filas){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+filas.map(function(f){ return f.map(valorCsv).join(','); }).join('\r\n')], {type:'text/csv;charset=utf-8'}));
  a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function avisaDescarga(texto){ document.getElementById('aviso-descarga').textContent = texto; }

function descargaBandeja(conDatos){
  var motivo = conDatos ? document.getElementById('f-motivo').value.trim() : '';
  if(conDatos && !perfil.descargaDatos) return;
  if(conDatos && !motivo){
    avisaDescarga('Escribe el motivo: la descarga con datos personales queda registrada con él.');
    document.getElementById('f-motivo').focus();
    return;
  }
  var lista = filtrada();
  var filas = [EXPORTA.map(function(c){ return c[0]; }).concat(conDatos ? EXPORTA_PERSONALES : [])].concat(lista.map(function(d){
    var quien = d.acuse.bloques.filter(function(b){ return b.id === 'quien'; })[0] || {filas:[]};
    return EXPORTA.map(function(c){ return c[1](d); }).concat(conDatos ? EXPORTA_PERSONALES.map(function(etq){
      var f = quien.filas.filter(function(x){ return x[0] === etq; })[0]; return f ? f[1] : '';
    }) : []);
  }));
  descargaCsv('bandeja-'+(conDatos ? 'con-datos-personales' : 'sin-datos-personales')+'.csv', filas);
  registra('Descarga la bandeja '+(conDatos ? 'con datos personales' : 'sin datos personales')+': '+lista.length+' denuncias'+(conDatos ? '. Motivo: '+motivo : ''));
  avisaDescarga('Se descargaron '+lista.length+' denuncias'+(conDatos ? '. La descarga quedó en la bitácora con su motivo.' : ', sin datos de quien denuncia.'));
}

/* Los indicadores del tablero con sus filtros, como los pinta el tablero: se

/* ---------- Personal (DEC-252) ---------- */

/* Los perfiles que una coordinación da a su personal. Directivos,
   administración y la primera coordinación de cada dirección general los da
   el SIA (documento 22, §2). */
var PERFILES_ALTA = [{id:'capturista', nom:'Capturista'}, {id:'atencion', nom:'Atención'}, {id:'coordinacion', nom:'Coordinación'}];
/* Lo que se pide al dar de alta, en su orden. El correo es con el que la
   persona entra a su cuenta, que es nominal (documento 22, §2). */
var CAMPOS_ALTA = [
  {id:'nombre', nom:'Nombre completo',        tipo:'text'},
  {id:'area',   nom:'Área de la que depende', tipo:'text',  ayuda:'La unidad de la dirección general a la que está adscrita, como en su nombramiento.'},
  {id:'cargo',  nom:'Cargo',                  tipo:'text'},
  {id:'correo', nom:'Correo institucional',   tipo:'email', ayuda:'Con él entra a su cuenta, que es suya y no se comparte.'}
];

/* Coordinación ve el suyo, con la baja; administración, el de las dos
   direcciones generales, sin cambiar nada. */
function tablaPersonal(lista, deCoordinacion){
  return '<div class="desliza" role="region" aria-label="Personal" tabindex="0"><table class="tabla-chica"><thead><tr><th scope="col">Nombre</th>'+
    (deCoordinacion ? '' : '<th scope="col">Dirección general</th>')+
    '<th scope="col">Área de la que depende</th><th scope="col">Cargo</th><th scope="col">Correo institucional</th><th scope="col">Perfil</th><th scope="col">Estado</th>'+
    (deCoordinacion ? '<th scope="col">Baja</th>' : '')+'</tr></thead><tbody>'+
    lista.map(function(x){
      return '<tr><th scope="row">'+esc(x.nombre)+'</th>'+(deCoordinacion ? '' : '<td>'+esc(x.dg)+'</td>')+
        '<td>'+esc(x.area)+'</td><td>'+esc(x.cargo)+'</td><td>'+esc(x.correo)+'</td><td>'+esc(porId(PERFILES_ALTA, x.perfil).nom)+'</td>'+
        '<td>'+(x.activa ? 'Activa' : 'De baja')+'</td>'+
        (deCoordinacion ? '<td>'+(x.activa ? '<button type="button" class="boton" onclick="bajaPersonal('+PERSONAL.indexOf(x)+')" aria-label="Dar de baja a '+esc(x.nombre)+'">Dar de baja</button>' : '')+'</td>' : '')+'</tr>';
    }).join('')+'</tbody></table></div>';
}

function pintaPersonal(){
  var p = porId(PANTALLAS, 'personal');
  document.getElementById('pantalla').innerHTML =
    '<div class="tarjeta"><h2 tabindex="-1">'+esc(p.nom)+'</h2><p class="resumen">'+esc(p.resumen)+'</p>'+
    '<h3>Personal de la '+esc(perfil.area)+'</h3>'+tablaPersonal(PERSONAL.filter(function(x){ return x.dg === perfil.area; }), true)+
    '<p class="nota-listado">La baja no borra: la persona ya no entra ni recibe asignaciones, y su nombre se conserva en lo que firmó y en la bitácora.</p>'+
    '<h3>Dar de alta</h3>'+
    CAMPOS_ALTA.map(function(c){
      return '<div class="campo campo-alta"><label for="a-'+c.id+'">'+esc(c.nom)+'</label>'+
        (c.ayuda ? '<p class="nota-listado" id="ay-'+c.id+'">'+esc(c.ayuda)+'</p>' : '')+
        '<input id="a-'+c.id+'" type="'+c.tipo+'" maxlength="120" autocomplete="off"'+(c.ayuda ? ' aria-describedby="ay-'+c.id+'"' : '')+'></div>';
    }).join('')+
    '<div class="campo campo-alta"><label for="a-perfil">Perfil</label><select id="a-perfil"><option value="">Elige el perfil</option>'+
      PERFILES_ALTA.map(function(x){ return '<option value="'+x.id+'">'+esc(x.nom)+'</option>'; }).join('')+'</select></div>'+
    '<p><button type="button" class="boton" onclick="altaPersonal()">Dar de alta</button></p>'+
    '<p class="conteo" id="aviso-personal" role="status"></p>'+
    '<p class="nota-listado">Queda en la '+esc(perfil.area)+'. Directivos y administración los da de alta el SIA. En el sistema, la cuenta se activa con el correo institucional (SIA-23). En la maqueta, lo que se da de alta o de baja vive en la memoria de la página y se pierde al recargar.</p></div>';
}
function avisaPersonal(texto){ document.getElementById('aviso-personal').textContent = texto; }

/* Todo dato es obligatorio y el correo debe parecer correo; dos personas
   activas no comparten correo, porque la cuenta es nominal. */
function altaPersonal(){
  if(perfil.rol !== 'coordinacion') return;
  var v = {}, falta = null;
  CAMPOS_ALTA.concat([{id:'perfil', nom:'Perfil'}]).forEach(function(c){
    var el = document.getElementById('a-'+c.id), mal;
    v[c.id] = el.value.trim();
    mal = !v[c.id] || !el.checkValidity();
    el.setAttribute('aria-invalid', mal ? 'true' : 'false');
    if(mal && !falta) falta = {el: el, c: c};
  });
  if(falta){
    avisaPersonal(v[falta.c.id] ? 'El '+falta.c.nom.toLowerCase()+' no es válido.' : 'Falta «'+falta.c.nom+'».');
    falta.el.focus();
    return;
  }
  if(PERSONAL.some(function(x){ return x.activa && x.correo.toLowerCase() === v.correo.toLowerCase(); })){
    avisaPersonal('Ya hay una persona activa con ese correo institucional: la cuenta es de una sola persona.');
    document.getElementById('a-correo').focus();
    return;
  }
  PERSONAL.push({nombre:v.nombre, dg:perfil.area, area:v.area, cargo:v.cargo, correo:v.correo, perfil:v.perfil, activa:true});
  registra('Da de alta a '+v.nombre+' ('+porId(PERFILES_ALTA, v.perfil).nom+', '+perfil.area+')');
  pintaPersonal();
  avisaPersonal('Se dio de alta a '+v.nombre+' con el perfil de '+porId(PERFILES_ALTA, v.perfil).nom.toLowerCase()+'.');
  document.getElementById('a-nombre').focus();
}

/* La baja deja a la persona inactiva. Una dirección general no se queda sin
   coordinación activa, y lo que la persona tenía abierto se avisa para
   reasignarlo. */
function bajaPersonal(i){
  var x = PERSONAL[i], abiertas;
  if(perfil.rol !== 'coordinacion' || !x || x.dg !== perfil.area || !x.activa) return;
  if(x.perfil === 'coordinacion' && activas(x.dg, 'coordinacion').length < 2){
    avisaPersonal('No se puede dar de baja a '+x.nombre+': la '+x.dg+' se quedaría sin coordinación activa.');
    return;
  }
  x.activa = false;
  abiertas = DENUNCIAS.filter(function(d){ return !cerrada(d) && d.tramite.asignado === x.nombre; }).length;
  registra('Da de baja a '+x.nombre+' ('+porId(PERFILES_ALTA, x.perfil).nom+', '+x.dg+')');
  pintaPersonal();
  avisaPersonal('Se dio de baja a '+x.nombre+'.'+(abiertas ? ' Tenía '+abiertas+(abiertas === 1 ? ' denuncia abierta asignada: hay que reasignarla.' : ' denuncias abiertas asignadas: hay que reasignarlas.') : ''));
  document.querySelector('#pantalla .desliza').focus();
}

/* ---------- Administración (bloque F) ---------- */

/* Los parámetros de la maqueta, con quién los fija: se leen de donde viven,
   para que la tabla no pueda quedarse atrás. */

    if(e.plazo && e.plazo.dias !== 'suelo' && !plazos.some(function(x){ return x[0] === 'Para '+e.plazo.para; }))
      plazos.push(['Para '+e.plazo.para, e.plazo.dias+' días hábiles', 'Manual Administrativo (DEC-84)']);
  });
  return plazos.concat([
    ['El procedimiento completo', Object.keys(PLAZO_PROCEDIMIENTO).map(function(k){ return PLAZO_PROCEDIMIENTO[k]+' días hábiles en la '+k; }).join('; '), 'Manual Administrativo (DEC-84)'],
    ['«Por vencer» en Inicio', AVISO_VENCE+' días hábiles', 'Cifra de prueba; las áreas'],
    ['Posible duplicado', UMBRAL_DUPLICADO.metros+' metros y '+UMBRAL_DUPLICADO.dias+' días', 'Cifra de prueba; la DGIVA (SIA-26)'],
    ['Denuncias cercanas en el expediente', RADIO_CERCANAS+' metros', 'Cifra de prueba; las áreas'],
    ['Mínimo para mostrar género y edad', String(MINIMO_AGREGADO), 'Cifra de prueba; la Unidad de Transparencia'],
    ['Denuncias por página en la bandeja', String(POR_PAGINA), 'La maqueta']]);
}

/* ---------- Expediente (bloque C) ---------- */

function fechaHora(iso){ return fechaCorta(iso)+', '+iso.slice(11, 16)+' h'; }
/* Un par etiqueta–valor; el valor ya viene escapado o armado. */
function par(etq, html){ return '<div><dt>'+esc(etq)+'</dt><dd>'+html+'</dd></div>'; }

/* El plazo que corre en el estado de la denuncia, o null si no corre
   ninguno. */
function plazoDe(d){
  var p = porId(ESTADOS, d.tramite.estado).plazo;
  if(!p) return null;
  var total = p.dias === 'suelo' ? PLAZO_PROCEDIMIENTO[d.tramite.area_actual] : p.dias, van = diasHabiles(d);
  return {para: p.para, total: total, van: van, vencido: van > total};
}
function plazoTexto(d){
  var p = plazoDe(d);
  if(p) return 'Para '+esc(p.para)+': '+p.total+' días hábiles; van '+p.van+(p.vencido ? ' <strong class="alerta">· vencido</strong>' : '');
  return cerrada(d) ? 'Ninguno: el trámite se cerró'
       : 'Sin plazo fijado: el de informar a quien denuncia sigue abierto (P-07)';
}

function seccionDenuncia(d){
  /* Lo capturado trae «Cómo llegó» en los bloques del acuse; aquí va sólo lo
     que pone el módulo: cuándo se capturó y quién (AD-03). */
  var c = d.captura, conf = d.tramite.materia_confirmada;
  var llegada = c
    ? par('Canal', esc(porId(CANALES, d.canal).nom))+par('Captura', esc(fechaHora(d.datos.fecha_acuse))+' · '+esc(c.capturo))
    : par('Canal', 'En línea')+par('Recepción', esc(fechaHora(d.datos.fecha_acuse))+', hora de la Ciudad (DEC-235)');
  return '<section class="seccion-exp"><h3>1. Denuncia</h3>'+
    '<dl class="ficha">'+llegada+
      par('Materia declarada', esc(porId(MATERIAS, d.datos.materia).nom))+
      par('Materia confirmada', esc(porId(MATERIAS, conf).nom)+(conf !== d.datos.materia ? ' <span class="senal">Distinta de la declarada (D-20)</span>' : ''))+
    '</dl>'+
    d.acuse.bloques.map(function(b){
      return '<h4>'+esc(b.titulo)+'</h4><dl class="ficha">'+b.filas.map(function(f){ return par(f[0], esc(f[1])); }).join('')+'</dl>'+
        (b.id === 'quien' ? '<p class="nota-listado">El género y la edad no se muestran por denuncia: sólo en agregado (documento 22, §7).</p>' : '');
    }).join('')+
    '<h4>Acuse</h4><dl class="ficha">'+par('Fundamento que citó', esc(d.acuse.fundamento))+'</dl></section>';
}

/* Lo que enseña el mapa del expediente: la zona protegida completa si el
   punto cae en una, porque su polígono es lo que decidió el turnado; si no,
   la alcaldía del punto, para ubicarlo en la Ciudad. */
function encuadre(d){
  var z = CAPAS.zonas.filter(function(c){ return c.nombre === d.datos.capa_nombre; })[0];
  var a = CAPAS.alcaldias.filter(function(c){ return c.nombre === d.datos.alcaldia; })[0];
  var c = cajaDe((z || a).g), lon = +d.datos.lon, lat = +d.datos.lat;
  return [Math.min(c[0], lon), Math.min(c[1], lat), Math.max(c[2], lon), Math.max(c[3], lat)];
}

function seccionUbicacion(d){
  var x = d.datos, sinPunto = !x.lat;
  var cerca = sinPunto ? [] : DENUNCIAS.filter(function(o){ return o !== d && o.datos.lat && distancia(x, o.datos) <= RADIO_CERCANAS; })
    .sort(function(a, b){ return distancia(x, a.datos) - distancia(x, b.datos); });
  return '<section class="seccion-exp"><h3>2. Ubicación</h3>'+
    (sinPunto ? '<p>Sin punto no hay mapa.</p>'
      : '<div class="mapa-exp">'+mapaSvg([d].concat(cerca), encuadre(d), 'Mapa del punto de la denuncia y de las cercanas', d, x.capa_nombre)+leyendaMapa()+'</div>')+
    '<dl class="ficha">'+
      par('Coordenadas', sinPunto ? 'Sin punto' : esc(x.lat+', '+x.lon))+
      par('Origen de la ubicación', x.ubicacion_origen === 'punto' ? 'El punto del formulario' : 'Sólo la dirección: falta ubicar el punto (SIA-09)')+
      par('Alcaldía del punto', esc(x.alcaldia || 'Sin punto'))+
      par('Alcaldía de la dirección', esc(x.alcaldia_dir || 'Sin dirección')+(x.alcaldia_discrepa === 'si' ? ' <span class="senal">No coinciden (DEC-118)</span>' : ''))+
      (x.colonia ? par('Colonia', esc(x.colonia+(x.colonia_cve ? ' ('+x.colonia_cve+')' : ''))) : '')+
      par('Tipo de zona', esc([x.capa_clase, x.capa_categoria, x.capa_nombre].filter(Boolean).join(' · ') || 'Sin ubicar'))+
      par('Celda UGA', esc(x.uga ? x.uga+' (capa '+x.uga_version+')' : 'Sin ubicar'))+
      par('Área que recibe', esc(x.dg_nombre || 'Por determinar'))+
      (x.dg_razon ? par('Por qué', esc(x.dg_razon)) : '')+
      par('Remisión', esc(x.remite_a || 'Ninguna'))+
    '</dl>'+
    '<h4>Denuncias cercanas</h4>'+
    (sinPunto ? '<p>Sin punto no se pueden buscar.</p>'
      : !cerca.length ? '<p>Ninguna a menos de '+RADIO_CERCANAS+' metros.</p>'
      : '<ul class="lista-exp">'+cerca.map(function(o){
          var ve = visibles().indexOf(o) >= 0;
          return '<li>'+(ve ? '<a href="#/expediente/'+idDe(o)+'">'+esc(o.datos.folio)+'</a>' : esc(o.datos.folio)+' (de otra área)')+
            ' · '+esc(porId(MATERIAS, o.datos.materia).nom)+' · a '+Math.round(distancia(x, o.datos))+' m · '+esc(porId(ESTADOS, o.tramite.estado).nom)+'</li>';
        }).join('')+'</ul>')+
    '<p class="nota-listado">Radio de prueba: '+RADIO_CERCANAS+' metros; lo fijan las áreas.</p></section>';
}

/* Qué es cada archivo, por su extensión: las del formulario (DEC-120). La
   batería 54 revisa que toda extensión que admite el formulario tenga aquí
   su clase. «nom» nombra la miniatura —«PDF 1»—, «tipo» es lo que el visor
   dice que es, y el dibujo ocupa el lugar del archivo, que en la maqueta no
   viaja. */
var CLASES_EVIDENCIA = [
  {nom:'Foto',  tipo:'Foto',                     ve:'la foto completa',   exts:['jpg','jpeg','png'],
   icono:'<path class="ev-icono" d="M60 42h9l5-7h12l5 7h9a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H60a4 4 0 0 1-4-4V46a4 4 0 0 1 4-4z"/><circle class="ev-icono" cx="80" cy="58" r="9"/>'},
  {nom:'Video', tipo:'Video',                    ve:'el video',           exts:['mp4','mov'],
   icono:'<rect class="ev-icono" x="56" y="38" width="48" height="38" rx="4"/><path class="ev-icono" d="M74 48v18l14-9z"/>'},
  {nom:'PDF',   tipo:'Documento PDF',            ve:'el documento',       exts:['pdf'],
   icono:'<path class="ev-icono" d="M66 32h20l12 12v34H66z M86 32v12h12 M72 54h20 M72 62h20 M72 70h14"/>'},
  {nom:'Word',  tipo:'Documento de Word',        ve:'el documento',       exts:['doc','docx'],
   icono:'<path class="ev-icono" d="M66 32h20l12 12v34H66z M86 32v12h12 M72 54h20 M72 62h20 M72 70h14"/>'},
  {nom:'Excel', tipo:'Hoja de cálculo de Excel', ve:'la hoja de cálculo', exts:['xls','xlsx'],
   icono:'<rect class="ev-icono" x="58" y="34" width="44" height="44" rx="3"/><path class="ev-icono" d="M58 49h44 M58 63h44 M73 34v44 M88 34v44"/>'}
];
function claseDe(a){
  var ext = a.name.split('.').pop().toLowerCase();
  return CLASES_EVIDENCIA.filter(function(c){ return c.exts.indexOf(ext) >= 0; })[0];
}
/* «Foto (JPG)», «Documento de Word (DOCX)»; el PDF no necesita repetirlo. */
function tipoDe(a){
  var c = claseDe(a);
  return c.tipo+(c.exts.length > 1 ? ' ('+a.name.split('.').pop().toUpperCase()+')' : '');
}
function dibujoDe(a, clase){
  return '<svg class="'+clase+'" viewBox="0 0 160 120" aria-hidden="true"><rect class="ev-fondo" width="160" height="120"/>'+claseDe(a).icono+
    '<text class="ev-texto" x="80" y="100">'+esc(claseDe(a).nom)+' de prueba</text></svg>';
}
/* Cada archivo se nombra por su clase y su orden dentro de ella: «Foto 2». */
function nombreDe(d, i){
  var c = claseDe(d.archivos[i]);
  return c.nom+' '+d.archivos.slice(0, i + 1).filter(function(a){ return claseDe(a) === c; }).length;
}
function cuandoFoto(a){
  return a.fecha_captura ? 'Tomada el '+fechaCorta(a.fecha_captura)+' a las '+a.fecha_captura.slice(11, 16)+' h, según la cámara' : 'La foto no dice cuándo se tomó';
}
/* Dónde se tomó, contra el lugar de la denuncia: es lo que quien revisa
   necesita saber, no las coordenadas. */
function dondeFoto(a, d){
  if(a.lat_captura === undefined) return 'La foto no dice dónde se tomó.';
  if(!d.datos.lat) return 'La foto trae su lugar, pero la denuncia no tiene punto para compararlo.';
  var m = distancia({lat:a.lat_captura, lon:a.lon_captura}, d.datos);
  return m < 50 ? 'En el lugar de la denuncia: a menos de 50 metros.'
    : m < 1000 ? 'A unos '+Math.round(m / 10) * 10+' metros del lugar de la denuncia.'
    : 'A '+(m / 1000).toFixed(1)+' km del lugar de la denuncia: conviene revisar si es el mismo sitio.';
}

/* La evidencia como la revisa una persona: una miniatura por archivo, que se
   abre con un clic. De cada uno, su nombre y su tipo, y de las fotos, cuándo
   y dónde se tomaron, en palabras. Peso, huella y coordenadas son datos del
   sistema: no se muestran (DEC-254). */
function seccionEvidencia(d){
  var n = d.archivos.length;
  return '<section class="seccion-exp"><h3>3. Evidencia</h3>'+
    (d.datos.soporte ? '<p>Soporte de la captura: <strong>'+esc(d.datos.soporte)+'</strong></p>' : '')+
    (!n ? '<p>Sin archivos adjuntos.</p>' :
      '<p>'+n+(n === 1 ? ' archivo' : ' archivos')+'. Da clic en uno para verlo en grande.</p><ul class="galeria">'+
      d.archivos.map(function(a, i){
        return '<li><button type="button" class="archivo-ev" aria-haspopup="dialog" onclick="abreArchivo(\''+idDe(d)+'\','+i+')">'+dibujoDe(a, 'miniatura')+
          '<span class="archivo-tit">'+esc(nombreDe(d, i))+'</span>'+
          '<span class="dato-sec">'+esc(claseDe(a).nom === 'Foto' ? cuandoFoto(a) : a.name)+'</span></button></li>';
      }).join('')+'</ul><dialog class="visor" id="visor" aria-labelledby="visor-tit"></dialog>')+
    '<p class="nota-listado">En la maqueta los archivos no viajan: cada dibujo está en su lugar.</p></section>';
}

/* El visor: el archivo en grande y lo que importa en palabras. Anterior y
   Siguiente recorren los del expediente. Es un diálogo del navegador: atrapa
   el foco, se cierra con Escape y, al cerrarse, devuelve el foco a la
   miniatura desde la que se abrió. */
function abreArchivo(id, i){
  var d = DENUNCIAS.filter(function(x){ return idDe(x) === id; })[0], a = d.archivos[i], n = d.archivos.length;
  var v = document.getElementById('visor'), foto = claseDe(a).nom === 'Foto';
  var paso = function(k, texto){ return '<button type="button" class="boton" onclick="abreArchivo(\''+id+'\','+k+')">'+texto+'</button>'; };
  v.innerHTML = '<h4 id="visor-tit" tabindex="-1">'+esc(nombreDe(d, i))+'</h4><p class="dato-sec">Archivo '+(i + 1)+' de '+n+'</p>'+
    dibujoDe(a, 'vista-grande')+
    '<dl class="ficha">'+(foto ? par('Cuándo', esc(cuandoFoto(a)))+par('Dónde', esc(dondeFoto(a, d))) : '')+
      par('Archivo', esc(a.name))+par('Tipo', esc(tipoDe(a)))+'</dl>'+
    '<p class="acciones-visor">'+(i > 0 ? paso(i - 1, 'Anterior') : '')+(i < n - 1 ? paso(i + 1, 'Siguiente') : '')+
      '<button type="button" class="boton" onclick="document.getElementById(\'visor\').close()">Cerrar</button></p>'+
    '<p class="nota-listado">En el sistema aquí se ve '+claseDe(a).ve+' y se descarga el original.</p>';
  if(!v.open) v.showModal();
  document.getElementById('visor-tit').focus();
}

function seccionActuaciones(d){
  return '<section class="seccion-exp"><h3>4. Actuaciones</h3><ol class="linea-tiempo">'+
    d.tramite.historial.map(function(h){
      return '<li><strong>'+esc(porId(ESTADOS, h.estado).nom)+'</strong> · '+esc(fechaHora(h.fecha))+' · '+esc(h.persona)+
        '<span class="dato-sec">'+esc(h.nota)+'</span></li>';
    }).join('')+'</ol><p class="nota-listado">Las actuaciones no se editan ni se borran (documento 22, §3.3).</p></section>';
}

function seccionContacto(d){
  var t = '<section class="seccion-exp"><h3>5. Contacto y notificación</h3>';
  if(perfil.rol !== 'atencion' && perfil.rol !== 'coordinacion')
    return t+'<p>Sólo la ven atención y coordinación (documento 22, §3.3).</p></section>';
  var anon = d.datos.identificacion === 'anonima', n = d.tramite.notificacion;
  var resultado = n ? (n.medio === 'correo' ? 'Por correo' : 'En el domicilio')+', '+esc(fechaHora(n.fecha))+
        (n.resultado === 'rebotado' ? ' · <strong class="alerta">el correo rebotó</strong>; queda constancia del intento (SIA-29)' : ' · entregada')
    : d.tramite.estado === 'resuelta' ? 'Pendiente: la denuncia está resuelta y falta notificar.'
    : 'Todavía no hay resultado que notificar.';
  return t+'<dl class="ficha">'+
    par('Dónde se le notifica', anon ? 'En el correo que dejó: '+esc(d.datos.correo)+' (DEC-233)' : 'En el domicilio que registró (sección 1, «Quién denuncia»)')+
    par('Comunicaciones', 'Ninguna registrada.'+(anon ? ' Si se le pide una aclaración y no contesta, el trámite sigue (RN-21).' : ''))+
    par('Notificación del resultado', resultado)+
  '</dl></section>';
}

function seccionVinculos(d){
  var principal = d.tramite.acumulada_en && DENUNCIAS.filter(function(o){ return o.datos.folio === d.tramite.acumulada_en; })[0];
  var acumuladas = DENUNCIAS.filter(function(o){ return o.tramite.acumulada_en === d.datos.folio; });
  function liga(o){ return visibles().indexOf(o) >= 0 ? '<a href="#/expediente/'+idDe(o)+'">'+esc(o.datos.folio)+'</a>' : esc(o.datos.folio); }
  return '<section class="seccion-exp"><h3>6. Vínculos</h3><dl class="ficha">'+
    par('Acumulada en', principal ? liga(principal) : 'No')+
    par('Acumuladas a ésta', acumuladas.length ? acumuladas.map(liga).join(', ') : 'Ninguna')+
    par('Posible duplicado de', parecidas(d).length ? parecidas(d).map(liga).join(', ') : 'Ninguna')+
    par('Expediente administrativo', 'No registrado en los datos de prueba')+
    (d.tramite.estado === 'remitida' ? par('Oficio de remisión', 'No registrado en los datos de prueba') : '')+
  '</dl></section>';
}

/* Una sola pantalla por denuncia (documento 22, §3.3): encabezado fijo, las
   acciones del perfil y seis secciones. Una denuncia que el perfil no ve no
   se abre aunque se escriba su folio en la dirección (SIA-23). */
function pintaExpediente(param){
  var d = DENUNCIAS.filter(function(x){ return idDe(x) === param; })[0];
  if(!d || visibles().indexOf(d) < 0){
    document.getElementById('pantalla').innerHTML = '<div class="tarjeta"><h2 tabindex="-1">Expediente</h2>'+
      '<p class="resumen">'+esc(porId(PANTALLAS, 'expediente').resumen)+'</p>'+
      '<p>'+(d ? 'Este perfil no ve la denuncia '+esc(d.datos.folio)+'.'
             : param ? 'No hay ninguna denuncia con el folio '+esc(param)+'.' : 'Elige una denuncia en la bandeja.')+'</p>'+
      '<p><a href="#/bandeja">Ir a la bandeja</a></p></div>';
    return;
  }
  registra('Consulta el expediente '+d.datos.folio+', con los datos de quien denuncia');
  var s = senales(d), acc = ACCIONES.filter(function(a){ return a.roles.indexOf(perfil.rol) >= 0; });
  document.getElementById('pantalla').innerHTML =
    '<div class="tarjeta">'+
      '<div class="exp-encabezado">'+
        '<h2 tabindex="-1">Expediente '+esc(d.datos.folio)+'</h2>'+
        '<dl class="exp-datos">'+
          par('Estado', esc(porId(ESTADOS, d.tramite.estado).nom))+
          par('Área que recibe', esc(d.tramite.area_actual || 'Por determinar'))+
          par('Remisión', esc(d.datos.remite_a || 'Ninguna'))+
          par('Persona asignada', esc(d.tramite.asignado || 'Sin asignar'))+
          par('Plazo vigente', plazoTexto(d))+
        '</dl>'+
        (s.length ? '<p class="senales">'+s.map(function(x){ return '<span class="senal">'+esc(x)+'</span>'; }).join('')+'</p>' : '')+
      '</div>'+
      '<section class="seccion-exp"><h3>Acciones de este perfil</h3>'+
        '<p class="nota-listado">En la maqueta no se ejecutan: cada una dice qué pediría y qué dejaría registrado. Son propuesta por acordar con las áreas.</p>'+
        acc.map(function(a){
          return '<details class="accion"><summary>'+esc(a.nom)+'</summary><dl class="ficha">'+par('Pide', esc(a.pide))+par('Deja registrado', esc(a.deja))+'</dl></details>';
        }).join('')+
      '</section>'+
      seccionDenuncia(d)+seccionUbicacion(d)+seccionEvidencia(d)+seccionActuaciones(d)+seccionContacto(d)+seccionVinculos(d)+
    '</div>';
}

function pintaMenu(actual){
  document.getElementById('menu').innerHTML = PANTALLAS.filter(function(p){ return !p.fueraDelMenu && permitida(p.id); })
    .map(function(p){
      return '<li><a href="#/'+p.id+'"'+(p.id === actual ? ' aria-current="page"' : '')+'>'+esc(p.nom)+'</a></li>';
    }).join('');
}

/* Cada pantalla tiene quien la pinte; la que queda es la de administración. */
function pintaPantalla(id, param){
  if(id === 'bandeja') return pintaBandeja(param);
  if(id === 'expediente') return pintaExpediente(param);
  if(id === 'inicio') return pintaInicio();
  if(id === 'tablero') return pintaTablero();
  if(id === 'mapa') return pintaMapa();
  if(id === 'captura') return pintaCaptura();
  if(id === 'busqueda') return pintaBusqueda();
  if(id === 'personal') return pintaPersonal();
  pintaAdministracion();
}

/* La pantalla va en la dirección (#/bandeja), y tras ella la vista o el folio
   (#/bandeja/por_turnar, #/expediente/2026-000101-9): «Atrás» del navegador
   regresa a lo anterior, como en el formulario (DEC-241). Una pantalla que el
   perfil no tiene lleva a la primera que sí. El foco va al título —o al de la
   vista, si se pidió una— sólo cuando la persona cambia de pantalla: al abrir
   la página, o al cambiar de perfil desde la lista, quitárselo la
   desorientaría. */
function muestra(mueveFoco){
  var r = location.hash.match(/^#\/([a-z_]+)(?:\/([\w-]+))?/) || [], id = r[1], param = r[2];
  if(!porId(PANTALLAS, id) || !permitida(id)){ id = perfil.pantallas[0]; param = ''; }
  pintaMenu(id);
  pintaPantalla(id, param);
  var h = document.querySelector('#pantalla [data-foco]') || document.querySelector('#pantalla h2');
  if(h && mueveFoco) h.focus();
}

/* Otro perfil ve otras denuncias: los filtros del anterior, en la bandeja, el
   tablero y el mapa, ya no aplican. */
function cambiaPerfil(id){
  perfil = porId(PERFILES, id) || PERFILES[0];
  registra('Entra con este perfil');
  bandeja.filtros = {}; bandeja.texto = ''; bandeja.pagina = 1; tablero.filtros = {}; mapa.filtros = {};
  muestra(false);
}

document.getElementById('perfil').innerHTML = PERFILES.map(function(p){
  return '<option value="'+p.id+'">'+esc(p.nom)+'</option>';
}).join('');
window.addEventListener('hashchange', function(){ muestra(true); });
muestra(false);
</script>
