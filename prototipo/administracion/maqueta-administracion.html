/* =========================================================
   Maqueta del módulo de administración y seguimiento (DEC-242)
   Bosquejo: documentacion/22-bosquejo-modulo-de-administracion.md
   Las variables de :root vienen del formulario: una sola paleta.
   ========================================================= */
/* ==== DESDE EL FORMULARIO: variables de :root (construccion/generar_admin.py; no se edita aquí) ==== */
:root{
  color-scheme: light;

  /* Sombras con color: el foco de los campos y el realce de las filas (DEC-227) */
  --sombra-foco: rgba(26,115,199,.18);
  --sombra-guinda: rgba(157,33,72,.12);

  /* Identidad */
  --guinda:#9D2148; --guinda-osc:#7A1A38; --guinda-cl:#F7F1F3;
  --dorado:#B28E5C;        /* sólo filetes y rellenos, nunca texto */
  --dorado-txt:#8C6C3E;    /* dorado legible, 4.85:1 */

  /* Neutros */
  --texto:#2B2D2E; --gris:#55585A; --gris-cl:#6B6E70;
  --linea:#DCDEE0;         /* separadores */
  --borde:#8E9295;         /* bordes de control, 3.14:1 */
  --fondo:#F4F5F6; --blanco:#FFFFFF;
  --beige:#FFFEF8;         /* encabezado y pie (DEC-132) */

  /* Interacción: lo que se puede tocar y lo que quedó elegido. */
  --azul:#1A56A8; --azul-cl:#EEF3FA;

  /* Función. Un color, un trabajo: si un tono hace dos cosas, deja de
     decir nada. Cinco familias y ninguna suelta fuera de aquí (DEC-95).
       rojo   → error: lo que impide continuar
       ámbar  → pendiente: lo que le falta al proyecto, no a la persona
       verde  → recibida: sólo la pantalla del acuse
       azul   → vive arriba, en Interacción: lo tocable y lo elegido
       neutro → aviso: lo que hay que leer sin alarmarse */
  --error:#B3261E; --error-bg:#FDF3F2; --error-txt:#8C1D18;
  --pend:#8A5200;  --pend-bg:#FFF3CD;  --pend-txt:#6B4A00;
  --ok:#1B6B43;    --ok-bg:#F1F8F4;    --ok-txt:#145032;
  --aviso-bg:#F7F8F9;
  --foco:#1A73C7;

  /* Fondos de superficie, antes sueltos en el código */
  --mapa-bg:#E8EAEC; --carga-bg:#FCFCFD; --redir-bg:#FFFDF9;

  /* Escala tipográfica */
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-base:16px;
  --t-lg:20px; --t-xl:24px; --t-2xl:30px;

  /* Radios */
  --r-ctrl:6px; --r-caja:10px; --r-pill:999px;
}
/* ==== FIN DE LO QUE VIENE DEL FORMULARIO ==== */

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--fondo); color:var(--texto); line-height:1.55; font-size:var(--t-base);
}
h1,h2,h3{font-family:'Cabin','Roboto',Arial,sans-serif;font-weight:600;text-wrap:balance}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- Estructura ---------- */
.contenedor{max-width:1180px;margin:0 auto;padding:0 20px}
/* La franja dice lo que es la página antes que nada: una maqueta con datos
   ficticios, no el sistema. Gris con rayas, como la de la versión publicada
   del formulario (DEC-137). */
.franja-maqueta{background:repeating-linear-gradient(135deg,var(--gris) 0 14px,var(--gris-cl) 14px 28px);color:var(--blanco);font-size:var(--t-md);padding:10px 20px}
.franja-maqueta p{max-width:1180px;margin:0 auto}
header.titulo{background:var(--beige);border-bottom:3px solid var(--dorado);padding:16px 0}
header.titulo .contenedor{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.logo-inst{display:block;width:auto;height:auto;max-width:100%;max-height:52px}
.titulo-txt h1{font-size:var(--t-xl);color:var(--guinda)}
.titulo-txt p{font-size:var(--t-md);color:var(--gris)}
.barra-perfil{background:var(--blanco);border-bottom:1px solid var(--linea);padding:10px 0}
.barra-perfil .contenedor{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.barra-perfil label{font-weight:600;font-size:var(--t-md)}
.barra-perfil select{font:inherit;font-size:var(--t-md);padding:6px 10px;border:1px solid var(--borde);border-radius:var(--r-ctrl);background:var(--blanco);color:var(--texto);min-height:40px}
.nota-simulada{font-size:var(--t-sm);color:var(--gris)}

/* ---------- Componentes ---------- */
.menu{background:var(--guinda)}
.menu ul{list-style:none;display:flex;flex-wrap:wrap;gap:2px}
.menu a{display:block;color:var(--blanco);text-decoration:none;padding:12px 16px;font-family:'Cabin','Roboto',Arial,sans-serif;font-weight:600;font-size:var(--t-md);min-height:44px}
.menu a:hover{background:var(--guinda-osc)}
.menu a[aria-current="page"]{background:var(--guinda-osc);box-shadow:inset 0 -4px 0 var(--dorado)}
main{padding:24px 0 48px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-caja);padding:24px}
.tarjeta h2{font-size:var(--t-xl);color:var(--guinda);margin-bottom:6px}
.tarjeta h3{font-size:var(--t-base);margin:18px 0 6px}
.resumen{color:var(--gris);font-size:var(--t-md)}
.cifra{font-size:var(--t-2xl);font-family:'Cabin','Roboto',Arial,sans-serif;font-weight:600;color:var(--guinda)}
.pendiente{display:inline-block;background:var(--pend-bg);border:1px dashed var(--pend);color:var(--pend-txt);padding:2px 7px;border-radius:4px;font-size:var(--t-xs);font-weight:600}
</style>
</head>

var perfil = PERFILES[0];

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pantallaDe(id){ return PANTALLAS.filter(function(p){ return p.id === id; })[0]; }
function permitida(id){ return perfil.pantallas.indexOf(id) >= 0; }

/* Lo que ve el perfil: su área, o sólo lo capturado por personal. En el
   sistema este filtro lo hace el servidor, no la pantalla (SIA-23). */
function visibles(){
  return DENUNCIAS.filter(function(d){
    if(perfil.area && d.tramite.area_actual !== perfil.area) return false;
    if(perfil.soloCapturadas && d.canal === 'en_linea') return false;
    return true;
  });
}

function pintaMenu(actual){
  document.getElementById('menu').innerHTML = PANTALLAS.filter(function(p){ return !p.fueraDelMenu && permitida(p.id); })

      return '<li><a href="#/'+p.id+'"'+(p.id === actual ? ' aria-current="page"' : '')+'>'+esc(p.nom)+'</a></li>';

}

      '<p class="resumen">'+esc(p.resumen)+'</p>'+
      '<h3>Con las denuncias de prueba</h3>'+
      '<p>Este perfil vería <span class="cifra">'+n+'</span> de '+DENUNCIAS.length+' denuncias'+
        (perfil.datosPersonales ? '.' : ', sin nombre, contacto ni domicilio de quien denuncia.')+'</p>'+
      '<p><span class="pendiente">Esta pantalla se construye en el bloque '+esc(p.bloque)+' de la maqueta</span></p>'+
    '</div>';
}

/* La pantalla va en la dirección (#/bandeja): «Atrás» del navegador regresa a
   la anterior, como en el formulario (DEC-241). Una pantalla que el perfil no
   tiene lleva a la primera que sí. El foco va al título sólo cuando la persona
   cambia de pantalla: al abrir la página, o al cambiar de perfil desde la
   lista, quitárselo la desorientaría. */
function muestra(mueveFoco){
  var id = (location.hash.match(/^#\/([a-z_]+)/) || [])[1];
  if(!pantallaDe(id) || !permitida(id)) id = perfil.pantallas[0];
  pintaMenu(id);
  pintaPantalla(id);
  var h = document.querySelector('#pantalla h2'); if(h && mueveFoco) h.focus();
}

function cambiaPerfil(id){
  perfil = PERFILES.filter(function(p){ return p.id === id; })[0] || PERFILES[0];
  muestra(false);
}

document.getElementById('perfil').innerHTML = PERFILES.map(function(p){
  return '<option value="'+p.id+'">'+esc(p.nom)+'</option>';
}).join('');
window.addEventListener('hashchange', function(){ muestra(true); });
muestra(false);
</script>
</body>
</html>
